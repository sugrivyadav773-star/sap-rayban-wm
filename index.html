<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=600, height=600, initial-scale=1.0, user-scalable=no">
  <title>SAP WM Meta Ray-Ban Glass App</title>
  <style>
    /* -------------------------------------------------------------
       META RAY-BAN DISPLAY VIEWPORT SPECIFICATIONS (600x600 px)
       ------------------------------------------------------------- */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      width: 600px;
      height: 600px;
      background-color: #000000;
      color: #00FF66; /* High-contrast HUD green */
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace;
      font-size: 18px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      padding: 16px;
      justify-content: space-between;
    }

    /* HUD Header */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px solid #00FF66;
      padding-bottom: 8px;
    }

    .title {
      font-size: 20px;
      font-weight: bold;
      letter-spacing: 1px;
      color: #FFFFFF;
    }

    .status-badge {
      font-size: 14px;
      background-color: #113311;
      padding: 4px 8px;
      border-radius: 4px;
      border: 1px solid #00FF66;
    }

    /* Main Display Output Box */
    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-top: 12px;
      margin-bottom: 12px;
    }

    .card {
      background-color: #111111;
      border: 1px solid #333333;
      border-radius: 8px;
      padding: 12px;
    }

    .prompt-box {
      border-color: #00E5FF;
      color: #00E5FF;
      min-height: 70px;
      font-size: 18px;
    }

    .response-box {
      border-color: #00FF66;
      color: #FFFFFF;
      flex: 1;
      font-size: 20px;
      overflow-y: auto;
      line-height: 1.4;
    }

    .transaction-details {
      margin-top: 8px;
      font-size: 16px;
      color: #FFCC00;
    }

    /* Controls & Footer */
    footer {
      display: flex;
      gap: 10px;
    }

    .btn {
      flex: 1;
      padding: 14px;
      font-size: 18px;
      font-weight: bold;
      color: #000000;
      background-color: #00FF66;
      border: none;
      border-radius: 6px;
      text-align: center;
      cursor: pointer;
    }

    .btn-secondary {
      background-color: #00E5FF;
    }

    .listening {
      animation: pulse 1.2s infinite;
      background-color: #FF3366 !important;
      color: #FFFFFF !important;
    }

    @keyframes pulse {
      0% { opacity: 1; }
      50% { opacity: 0.5; }
      100% { opacity: 1; }
    }
  </style>
</head>
<body>

  <!-- HUD HEADER -->
  <header>
    <div class="title">SAP ECC WM GLASS</div>
    <div id="connectionStatus" class="status-badge">OData: Ready</div>
  </header>

  <!-- GLASS DISPLAY OUTPUT CONTAINER -->
  <main>
    <div class="card prompt-box">
      <strong>Voice Input:</strong>
      <div id="speechText">Tap 'Listen' or say "SAP..."</div>
    </div>

    <div class="card response-box">
      <strong>WM Chatbot:</strong>
      <div id="chatbotOutput">Awaiting command. Try: "Look up bin A-01-02" or "Receive material MAT100".</div>
      <div id="transactionOutput" class="transaction-details"></div>
    </div>
  </main>

  <!-- GLASS FOOTER CONTROLS -->
  <footer>
    <button id="micBtn" class="btn" onclick="toggleVoiceRecognition()">🎤 Listen (Glass Mic)</button>
    <button id="clearBtn" class="btn btn-secondary" onclick="resetDisplay()">Clear</button>
  </footer>

  <script>
    /* =========================================================================
       1. SAP ECC ODATA SERVICES CONFIGURATION & PLACEHOLDERS
       ========================================================================= */
    const SAP_CONFIG = {
      baseUrl: "https://YOUR_SAP_ECC_HOST:8000/sap/opu/odata/sap/",
      client: "100",
      authHeader: "Basic " + btoa("USERNAME:PASSWORD"), // Replace with OAuth2 Token or SAP Credentials
      endpoints: {
        // SAP ECC Warehouse Management OData Placeholders
        stockOverview: "ZECC_WM_STOCK_SRV/StockSet",            // Stock lookup by Bin / Material
        goodsReceipt:  "ZECC_WM_GOODS_RECEIPT_SRV/ReceiptSet",   // MIGO Goods Receipt (Movement Type 101)
        transferOrder: "ZECC_WM_TRANSFER_ORDER_SRV/TOSet",       // LT01/LT12 Transfer Order creation/confirmation
        physicalCount: "ZECC_WM_INVENTORY_SRV/PhysCountSet"     // LI11N Physical Inventory Count
      }
    };

    /**
     * Generic SAP OData Request Helper Placeholder
     */
    async function callSapOData(endpointKey, method = 'GET', payload = null) {
      const url = `${SAP_CONFIG.baseUrl}${SAP_CONFIG.endpoints[endpointKey]}?sap-client=${SAP_CONFIG.client}&$format=json`;
      
      const headers = {
        "Authorization": SAP_CONFIG.authHeader,
        "Accept": "application/json",
        "Content-Type": "application/json",
        "X-Requested-With": "XMLHttpRequest"
      };

      console.log(`[SAP OData Request] ${method} -> ${url}`, payload);

      // PLACEHOLDER EXECUTION (Simulating SAP ECC OData response for demonstration)
      return new Promise((resolve) => {
        setTimeout(() => {
          resolve({
            d: {
              status: "SUCCESS",
              sapMessage: "SAP ECC Transaction processed successfully",
              timestamp: new Date().toISOString(),
              data: payload || { Bin: "A-01-02", Material: "MAT-8849", Qty: 42, Unit: "EA" }
            }
          });
        }, 800);
      });

      /* REAL ODATA FETCH IMPLEMENTATION (Uncomment when SAP system details are populated):
      try {
        const response = await fetch(url, {
          method: method,
          headers: headers,
          body: payload ? JSON.stringify(payload) : null
        });
        return await response.json();
      } catch (err) {
        console.error("SAP OData Error:", err);
        throw err;
      }
      */
    }

    /* =========================================================================
       2. VOICE SYNTHESIS & RECOGNITION (GLASS MIC & SPEAKERS)
       ========================================================================= */
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    let recognition = null;
    let isListening = false;

    if (SpeechRecognition) {
      recognition = new SpeechRecognition();
      recognition.continuous = false;
      recognition.lang = 'en-US';
      recognition.interimResults = false;

      recognition.onstart = () => {
        isListening = true;
        const micBtn = document.getElementById('micBtn');
        micBtn.classList.add('listening');
        micBtn.innerText = "🔴 Listening...";
      };

      recognition.onend = () => {
        isListening = false;
        const micBtn = document.getElementById('micBtn');
        micBtn.classList.remove('listening');
        micBtn.innerText = "🎤 Listen (Glass Mic)";
      };

      recognition.onresult = (event) => {
        const transcript = event.results[0][0].transcript;
        document.getElementById('speechText').innerText = `"${transcript}"`;
        processVoiceCommand(transcript);
      };
    } else {
      document.getElementById('speechText').innerText = "Web Speech API not supported on browser.";
    }

    function toggleVoiceRecognition() {
      if (!recognition) return;
      if (isListening) {
        recognition.stop();
      } else {
        recognition.start();
      }
    }

    /**
     * Output voice feedback through Meta Ray-Ban Glass Speakers
     */
    function speakGlassOutput(text) {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel(); // Stop prior speech
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.rate = 1.0;
        utterance.pitch = 1.0;
        window.speechSynthesis.speak(utterance);
      }
    }

    /* =========================================================================
       3. WAREHOUSE MANAGEMENT CHATBOT ENGINE & TRANSACTIONS
       ========================================================================= */
    async function processVoiceCommand(command) {
      const lowerCmd = command.toLowerCase();
      const outputDiv = document.getElementById('chatbotOutput');
      const txDiv = document.getElementById('transactionOutput');
      txDiv.innerText = "";

      // Transaction 1: Stock / Bin Query (e.g., "Look up bin A-01" or "Check stock")
      if (lowerCmd.includes('bin') || lowerCmd.includes('stock') || lowerCmd.includes('look up')) {
        outputDiv.innerText = "Querying SAP WM Bin Stock...";
        
        const res = await callSapOData('stockOverview', 'GET');
        const textResponse = `Bin A-01-02 contains 42 units of Material MAT-8849.`;
        
        outputDiv.innerText = textResponse;
        txDiv.innerText = `[SAP OData GET] StockSet Endpoint Executed`;
        speakGlassOutput(textResponse);
      }
      
      // Transaction 2: Goods Receipt (e.g., "Receive material MAT100")
      else if (lowerCmd.includes('receive') || lowerCmd.includes('goods receipt') || lowerCmd.includes('migo')) {
        outputDiv.innerText = "Processing Goods Receipt in SAP ECC...";
        
        const payload = { Material: "MAT-100", Quantity: 10, Plant: "1000", StorageLoc: "0001" };
        const res = await callSapOData('goodsReceipt', 'POST', payload);
        const textResponse = `Goods Receipt posted in SAP. Material MAT-100 quantity 10 received.`;
        
        outputDiv.innerText = textResponse;
        txDiv.innerText = `[SAP OData POST] Movement Type 101 Posted`;
        speakGlassOutput(textResponse);
      }

      // Transaction 3: Transfer Order / Pick (e.g., "Confirm transfer order" or "Move item")
      else if (lowerCmd.includes('transfer') || lowerCmd.includes('move') || lowerCmd.includes('pick')) {
        outputDiv.innerText = "Creating Transfer Order (LT01)...";
        
        const payload = { SourceBin: "A-01-02", DestBin: "STAGE-01", Qty: 5 };
        const res = await callSapOData('transferOrder', 'POST', payload);
        const textResponse = `Transfer Order created. Move 5 units from A-01-02 to STAGE-01.`;
        
        outputDiv.innerText = textResponse;
        txDiv.innerText = `[SAP OData POST] TO #89042 Generated`;
        speakGlassOutput(textResponse);
      }

      // Transaction 4: Physical Inventory Count (e.g., "Count bin A-01")
      else if (lowerCmd.includes('count') || lowerCmd.includes('inventory')) {
        outputDiv.innerText = "Submitting physical count to SAP...";
        
        const payload = { Bin: "A-01-02", CountedQty: 42 };
        const res = await callSapOData('physicalCount', 'POST', payload);
        const textResponse = `Physical count of 42 units recorded for Bin A-01-02.`;
        
        outputDiv.innerText = textResponse;
        txDiv.innerText = `[SAP OData POST] LI11N Inventory Count Saved`;
        speakGlassOutput(textResponse);
      }

      // Fallback
      else {
        const textResponse = "Command not recognized. Try saying check stock, receive material, or create transfer order.";
        outputDiv.innerText = textResponse;
        speakGlassOutput(textResponse);
      }
    }

    function resetDisplay() {
      document.getElementById('speechText').innerText = "Tap 'Listen' or say command...";
      document.getElementById('chatbotOutput').innerText = "Awaiting command.";
      document.getElementById('transactionOutput').innerText = "";
      window.speechSynthesis.cancel();
    }
  </script>
</body>
</html>
